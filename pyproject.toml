[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "girlframe-discord"
version = "0.1.0"
description = "Private HarpyEngine server provisioning and saved character drafts"
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "discord.py==2.7.1",
    "sqlalchemy==2.0.55",
    "alembic==1.20.1",
    "pydantic==2.14.2",
]

[dependency-groups]
dev = [
    "jsonschema==4.26.0",
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==1.20.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/girlframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers"
filterwarnings = [
    "error",
    "ignore:'audioop' is deprecated and slated for removal in Python 3.13:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["GIRLFRAME_Discord_Codex_Handoff_v0.2"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
files = ["src/girlframe"]
strict = true
